<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="metricGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.05)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.45)" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes barGrow {
      0% { transform: scaleY(0.7); }
      50% { transform: scaleY(1.05); }
      100% { transform: scaleY(0.7); }
    }
    .chart-line {
      stroke-dasharray: 8, 4;
      animation: dashMove 14s linear infinite;
    }
    .floating-card-1 {
      animation: floatCard1 6s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-card-2 {
      animation: floatCard2 7s ease-in-out infinite;
      transform-origin: center;
    }
    .pulse-circle {
      animation: pulseGlow 4s ease-in-out infinite;
      transform-origin: center;
    }
    .bar-anim-1 { animation: barGrow 4.5s ease-in-out infinite; transform-origin: bottom; }
    .bar-anim-2 { animation: barGrow 5.5s ease-in-out infinite 0.5s; transform-origin: bottom; }
    .bar-anim-3 { animation: barGrow 4s ease-in-out infinite 1s; transform-origin: bottom; }
    .bar-anim-4 { animation: barGrow 5s ease-in-out infinite 1.5s; transform-origin: bottom; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Glowing Background Orbs (Dynamic) -->
  <circle cx="1020" cy="90" r="130" fill="#6366f1" filter="url(#glow)" class="pulse-circle" opacity="0.25" />
  <circle cx="150" cy="280" r="100" fill="#0ea5e9" filter="url(#glow)" class="pulse-circle" opacity="0.2" />

  <!-- Background Dynamic SaaS Revenue Bars (Right Side, lower layer) -->
  <g opacity="0.65">
    <rect class="bar-anim-1" x="840" y="210" width="18" height="90" rx="4" fill="url(#barGrad)" />
    <rect class="bar-anim-2" x="870" y="170" width="18" height="130" rx="4" fill="url(#barGrad)" />
    <rect class="bar-anim-3" x="900" y="140" width="18" height="160" rx="4" fill="url(#barGrad)" />
    <rect class="bar-anim-4" x="930" y="100" width="18" height="200" rx="4" fill="url(#barGrad)" />
    <rect class="bar-anim-2" x="960" y="125" width="18" height="175" rx="4" fill="url(#barGrad)" />
    <rect class="bar-anim-3" x="990" y="80" width="18" height="220" rx="4" fill="url(#barGrad)" />
  </g>

  <!-- Dynamic Area and Spline Line Graph (Background behind cards) -->
  <path d="M 750,290 C 820,280 880,210 930,190 C 980,170 1020,110 1120,95 L 1120,300 L 750,300 Z" fill="url(#metricGrad1)" opacity="0.7"/>
  <path d="M 750,290 C 820,280 880,210 930,190 C 980,170 1020,110 1120,95" fill="none" stroke="#38bdf8" stroke-width="3.5" filter="url(#glow)" class="chart-line" />

  <!-- Floating Dynamic Metric Pill Card 1: MRR & Growth -->
  <g class="floating-card-1">
    <rect x="740" y="45" width="190" height="68" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#softShadow)" />
    <circle cx="765" cy="79" r="14" fill="#0369a1" />
    <path d="M 760,82 L 764,76 L 770,76" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="790" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">NET MRR GROWTH</text>
    <text x="790" y="93" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">$142,850</text>
    <rect x="880" y="78" width="42" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
    <text x="888" y="91" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700">+24.8%</text>
  </g>

  <!-- Floating Dynamic Metric Pill Card 2: ARR / NRR / Churn -->
  <g class="floating-card-2">
    <rect x="955" y="190" width="180" height="66" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" filter="url(#softShadow)" />
    <circle cx="980" cy="223" r="14" fill="#581c87" />
    <path d="M 975,223 L 980,218 L 985,223" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1005" y="213" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">ARR / RETENTION</text>
    <text x="1005" y="238" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">$1.71M • 118%</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Subtitles (High Contrast, Never Obscured) -->
  <g>
    <!-- Top Category Pill Badge -->
    <rect x="65" y="55" width="235" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="80" cy="69" r="5" fill="#38bdf8" />
    <text x="94" y="73" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1">CURATED SAAS INTELLIGENCE</text>

    <!-- Main Title -->
    <text x="65" y="140" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      SaaS MRR / ARR Analytics
    </text>
    <text x="65" y="185" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; Revenue Dashboards 📊
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="65" y="232" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      The definitive directory of commercial platforms &amp; open-source engines
    </text>
    <text x="65" y="256" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
      for tracking Monthly Recurring Revenue, Churn, LTV, Cohorts &amp; Subscription Health.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(65, 285)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="95" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">⚡ MRR / ARR</text>
      <!-- Tag 2 -->
      <rect x="105" y="0" width="110" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="117" y="17" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">📉 Churn &amp; NRR</text>
      <!-- Tag 3 -->
      <rect x="225" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="237" y="17" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">🚀 Open Source &amp; API</text>
      <!-- Tag 4 -->
      <rect x="370" y="0" width="105" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="382" y="17" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">⭐ Self-Hosted</text>
    </g>
  </g>
</svg>
